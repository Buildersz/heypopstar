<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Popstar Cast Receiver</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0A0A0F;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
    }
    #idle-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      font-family: sans-serif;
      background: #0A0A0F;
      z-index: 1;
    }
    #idle-screen h1 {
      background: linear-gradient(90deg, #FF2E92, #3EC1FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 64px;
    }
  </style>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <div id="idle-screen">
    <h1>Popstar</h1>
    <p>Waiting for a song...</p>
  </div>
  <div id="player" style="display:none;"></div>

  <script>
    let ytPlayer = null;
    let playerReady = false;
    let pendingLoad = null;
    let playerManager = null;
    let currentMediaInfo = null;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: {
          autoplay: 1,
          controls: 0,
          rel: 0,
        },
        events: {
          onReady: () => {
            playerReady = true;
            if (pendingLoad) {
              playVideo(pendingLoad.videoId, pendingLoad.title);
              pendingLoad = null;
            }
          },
          onStateChange: onPlayerStateChange,
        },
      });
    }

    // Register real media info with playerManager once we know the video's
    // actual duration - this gives playerManager genuine data to track,
    // instead of it being permanently stuck at "loading" with no real
    // media session ever registered.
    function registerMediaWithPlayerManager(videoId, title, durationSeconds) {
      const mediaInfo = new cast.framework.messages.MediaInformation();
      mediaInfo.contentId = videoId;
      mediaInfo.contentType = 'video/youtube';
      mediaInfo.streamType = cast.framework.messages.StreamType.BUFFERED;
      mediaInfo.duration = durationSeconds;
      mediaInfo.metadata = new cast.framework.messages.MovieMediaMetadata();
      mediaInfo.metadata.title = title || 'Popstar';

      currentMediaInfo = mediaInfo;
      playerManager.setMediaInformation(mediaInfo, true);
    }

    function onPlayerStateChange(event) {
      if (!playerManager || !currentMediaInfo) return;

      if (event.data === YT.PlayerState.PLAYING) {
        playerManager.broadcastStatus(true);
      } else if (event.data === YT.PlayerState.PAUSED) {
        playerManager.broadcastStatus(true);
      } else if (event.data === YT.PlayerState.ENDED) {
        playerManager.broadcastStatus(true);
      }
    }

    function playVideo(videoId, title) {
      document.getElementById('idle-screen').style.display = 'none';
      document.getElementById('player').style.display = 'block';

      if (playerReady && ytPlayer) {
        ytPlayer.loadVideoById(videoId);

        // Wait briefly for YouTube to report the real video duration,
        // then register it with playerManager so it has accurate info
        const checkDuration = setInterval(() => {
          const duration = ytPlayer.getDuration();
          if (duration && duration > 0) {
            clearInterval(checkDuration);
            registerMediaWithPlayerManager(videoId, title, duration);
          }
        }, 300);
      } else {
        pendingLoad = { videoId, title };
      }
    }

    const context = cast.framework.CastReceiverContext.getInstance();
    playerManager = context.getPlayerManager();

    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      (loadRequestData) => {
        const videoId = loadRequestData.media.contentId;
        const title = loadRequestData.media.metadata && loadRequestData.media.metadata.title;
        playVideo(videoId, title);
        return null;
      }
    );

    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    context.start(options);
  </script>
</body>
</html>
