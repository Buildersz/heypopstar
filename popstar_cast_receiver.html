<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Popstar Cast Receiver</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0A0A0F;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
    }
    #idle-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      font-family: sans-serif;
      background: #0A0A0F;
      z-index: 1;
    }
    #idle-screen h1 {
      background: linear-gradient(90deg, #FF2E92, #3EC1FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 64px;
    }
  </style>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <div id="idle-screen">
    <h1>Popstar</h1>
    <p>Waiting for a song...</p>
  </div>
  <div id="player" style="display:none;"></div>

  <script>
    const CUSTOM_NAMESPACE = 'urn:x-cast:com.buildersz.popstar';

    let ytPlayer = null;
    let playerReady = false;
    let pendingVideoId = null;
    let castContext = null;

    function debugLog(msg) {
      console.log('[Popstar] ' + msg);
    }

    window.onerror = function(message, source, lineno, colno, error) {
      debugLog(`JS ERROR: ${message} (line ${lineno})`);
    };

    function onYouTubeIframeAPIReady() {
      debugLog('YouTube API ready');
      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: {
          autoplay: 1,
          controls: 0,
          rel: 0,
        },
        events: {
          onReady: () => {
            debugLog('YT player onReady fired');
            playerReady = true;
            if (pendingVideoId) {
              playVideo(pendingVideoId);
              pendingVideoId = null;
            }
          },
          onStateChange: onPlayerStateChange,
          onError: (e) => debugLog('YT player onError: ' + JSON.stringify(e.data)),
        },
      });
    }

    function onPlayerStateChange(event) {
      const stateNames = {'-1': 'UNSTARTED', 0: 'ENDED', 1: 'PLAYING', 2: 'PAUSED', 3: 'BUFFERING', 5: 'CUED'};
      debugLog('YT state changed: ' + (stateNames[event.data] || event.data));

      if (event.data === YT.PlayerState.ENDED) {
        sendCustomMessage({ type: 'songEnded' });
      } else if (event.data === YT.PlayerState.PLAYING) {
        sendCustomMessage({ type: 'songPlaying' });
      }
    }

    function sendCustomMessage(data) {
      if (!castContext) {
        debugLog('Cannot send custom message - castContext not ready');
        return;
      }
      try {
        castContext.sendCustomMessage(CUSTOM_NAMESPACE, undefined, data);
        debugLog('Sent custom message: ' + JSON.stringify(data));
      } catch (e) {
        debugLog('sendCustomMessage ERROR: ' + e.message);
      }
    }

    function playVideo(videoId) {
      debugLog('playVideo called: ' + videoId);
      document.getElementById('idle-screen').style.display = 'none';
      document.getElementById('player').style.display = 'block';
      if (playerReady && ytPlayer) {
        ytPlayer.loadVideoById(videoId);
        debugLog('loadVideoById called');
      } else {
        debugLog('Player not ready yet, queuing load');
        pendingVideoId = videoId;
      }
    }

    try {
      castContext = cast.framework.CastReceiverContext.getInstance();
      const playerManager = castContext.getPlayerManager();
      debugLog('CastReceiverContext initialized');

      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.LOAD,
        (loadRequestData) => {
          const media = loadRequestData.media || {};
          let videoId = media.contentId;
          if (!videoId || videoId === 'undefined') {
            // iOS Cast SDK sends contentUrl instead of contentId
            const url = media.contentUrl || media.entity || '';
            const m = url.match(/[?&]v=([\w-]{11})/) || url.match(/youtu\.be\/([\w-]{11})/);
            videoId = m ? m[1] : null;
          }
          debugLog('LOAD received, videoId=' + videoId + ' (contentId=' + media.contentId + ', contentUrl=' + media.contentUrl + ')');
          if (videoId) playVideo(videoId);
          return null;
        }
      );

      const options = new cast.framework.CastReceiverOptions();
      options.disableIdleTimeout = true;
      options.customNamespaces = {};
      options.customNamespaces[CUSTOM_NAMESPACE] = cast.framework.system.MessageType.JSON;
      castContext.start(options);
      debugLog('context.start() called');
    } catch (e) {
      debugLog('INIT ERROR: ' + e.message);
    }
  </script>
</body>
</html>
